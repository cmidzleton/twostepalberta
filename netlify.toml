[build]
  command = "sh build.sh"
  publish = "."

[[headers]]
  for = "/dances.ics"
  [headers.values]
    Content-Type = "text/calendar; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/calgary/dances.ics"
  [headers.values]
    Content-Type = "text/calendar; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/calgary/feed.xml"
  [headers.values]
    Content-Type = "application/rss+xml; charset=utf-8"

[[headers]]
  for = "/feed.xml"
  [headers.values]
    Content-Type = "application/rss+xml; charset=utf-8"

[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"

# Send http://www straight to the main https address in one hop (instead of http://www -> https://www -> https://).
[[redirects]]
  from = "http://www.twostepalberta.ca/*"
  to = "https://twostepalberta.ca/:splat"
  status = 301
  force = true
