[build]
  command = "sh build.sh"
  publish = "."

[[headers]]
  for = "/dances.ics"
  [headers.values]
    Content-Type = "text/calendar; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/feed.xml"
  [headers.values]
    Content-Type = "application/rss+xml; charset=utf-8"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"
